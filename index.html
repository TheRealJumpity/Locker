<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Pelmenki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181A;
    --surface: #1F2023;
    --surface-2: #26282C;
    --border: #34363B;
    --text: #E9E7E2;
    --text-dim: #8B8D92;
    --accent: #96AD82;
    --accent-soft: rgba(150,173,130,0.16);
    --danger: #C97C6B;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--accent-soft); color: var(--text); }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #app {
    max-width: 640px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .wordmark { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: 0.01em; }
  .status {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    min-width: 58px;
    text-align: right;
  }

  .icon-btn {
    background: none;
    border: 1px solid transparent;
    color: var(--text-dim);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn.active { color: var(--accent); background: var(--accent-soft); }
  .icon-btn.primary { background: var(--accent); color: var(--bg); }
  .icon-btn.primary:hover { opacity: 0.9; background: var(--accent); }
  .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .eye-mark .lens { fill: none; stroke: var(--text-dim); stroke-width: 1.4; }
  .eye-mark .ear { fill: var(--text-dim); opacity: 0.55; }
  .eye-mark .pupil { fill: var(--accent); transition: rx .25s ease; }
  .eye-mark.idle .pupil { animation: slow-blink 5s ease-in-out infinite; }
  .eye-mark.listening .pupil { rx: 6; }
  .eye-mark.thinking .pupil { rx: 1; }
  .eye-mark.speaking .pupil { animation: talk-pulse .7s ease-in-out infinite; }
  @keyframes slow-blink { 0%, 90%, 100% { ry: 6; } 95% { ry: 0.5; } }
  @keyframes talk-pulse { 0%, 100% { rx: 2; } 50% { rx: 4.5; } }
  @media (prefers-reduced-motion: reduce) {
    .eye-mark .pupil { animation: none !important; }
  }

  .tabs { display: flex; gap: 18px; padding: 12px 20px 0; flex-shrink: 0; }
  .tab {
    background: none; border: none; color: var(--text-dim);
    font-size: 14px; padding: 0 0 10px; border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .panel { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .chat-log { display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 82%; line-height: 1.55; font-size: 15px; white-space: pre-wrap; }
  .msg.user {
    align-self: flex-end; background: var(--surface-2);
    padding: 10px 14px; border-radius: 14px 14px 4px 14px;
  }
  .msg.assistant { align-self: flex-start; }

  .tasks-add { display: flex; gap: 8px; margin-bottom: 16px; }
  .tasks-add input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; font-size: 14px;
  }
  .task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .task { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--border); }
  .task.done .task-title { color: var(--text-dim); text-decoration: line-through; }
  .task-check {
    width: 20px; height: 20px; border-radius: 6px; border: 1px solid var(--border);
    background: none; font-size: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: var(--bg);
  }
  .task.done .task-check { background: var(--accent); border-color: var(--accent); }
  .task-title { flex: 1; font-size: 14px; }
  .task-del { background: none; border: none; color: var(--text-dim); font-size: 17px; line-height: 1; }
  .empty { color: var(--text-dim); font-size: 14px; font-style: italic; padding: 8px 2px; }

  .input-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 20px; border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .input-bar input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; font-size: 15px;
  }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 10;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; width: 100%; max-width: 380px;
    display: flex; flex-direction: column; gap: 14px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 18px; }
  .modal label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); }
  .modal label input[type=text], .modal label input[type=password], .modal select {
    font-family: var(--font-body); background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 9px 10px; font-size: 14px;
  }
  .modal label.check { flex-direction: row; align-items: center; gap: 8px; font-family: var(--font-body); color: var(--text); font-size: 14px; }
  .hint { font-size: 12px; color: var(--text-dim); line-height: 1.6; margin: 0; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .btn { border-radius: 9px; padding: 8px 16px; font-size: 14px; border: 1px solid var(--border); background: none; color: var(--text); }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .btn.ghost { color: var(--text-dim); }

  @media (max-width: 400px) {
    .topbar, .tabs, .panel, .input-bar { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="eye-mark idle" id="eyeMark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <path class="ear" d="M7,11 L10,4 L13,11 Z" />
        <path class="ear" d="M19,11 L22,4 L25,11 Z" />
        <path class="lens" d="M4,16 Q16,4 28,16 Q16,28 4,16 Z" />
        <ellipse class="pupil" id="pupil" cx="16" cy="16" rx="2.5" ry="6" />
      </svg>
      <span class="wordmark">Pelmenki</span>
    </div>
    <div class="status" id="statusLabel">idle</div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1Z"/></svg>
    </button>
  </header>

  <nav class="tabs">
    <button class="tab active" id="tabChatBtn">Chat</button>
    <button class="tab" id="tabTasksBtn">Tasks</button>
  </nav>

  <main class="panel" id="chatPanel">
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
  </main>

  <main class="panel" id="tasksPanel" hidden>
    <div class="tasks-add">
      <input type="text" id="taskInput" placeholder="Add a task…" />
      <button class="icon-btn primary" id="taskAddBtn" aria-label="Add task">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <ul class="task-list" id="taskList"></ul>
  </main>

  <footer class="input-bar" id="inputBar">
    <input type="text" id="chatInput" placeholder="Talk to Pelmenki…" autocomplete="off" />
    <button class="icon-btn" id="micBtn" aria-label="Voice input">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
    </button>
    <button class="icon-btn primary" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/></svg>
    </button>
  </footer>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <label>ElevenLabs API key
      <input type="password" id="apiKeyInput" placeholder="paste key here" autocomplete="off" />
    </label>
    <label>Voice ID
      <input type="text" id="voiceIdInput" />
    </label>
    <label>Voice quality
      <select id="voiceQualitySelect">
        <option value="eleven_flash_v2_5">Flash — fastest</option>
        <option value="eleven_multilingual_v2">Multilingual — richer</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="voiceEnabledInput" /> Speak replies aloud</label>
    <label class="check"><input type="checkbox" id="rememberInput" /> Remember key on this device</label>
    <p class="hint">The key is only ever used from your browser to call ElevenLabs directly — it's never written into this app's code. Leave it blank and Pelmenki still speaks, just with your browser's built-in voice instead.</p>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">Cancel</button>
      <button class="btn primary" id="modalSave">Save</button>
    </div>
  </div>
</div>
<audio id="ttsPlayer" hidden></audio>

<script>
(function(){
  'use strict';

  var SYSTEM_PROMPT = "You are Pelmenki - a sharp, minimal AI assistant with the quiet self-possession of a cat. You live in the user's browser as their everyday assistant. Speak the way you'd talk out loud: short, direct sentences, no markdown, no headers, no bullet lists - your replies are often read aloud by a voice engine. You can manage a task list (add_task, complete_task, list_tasks) and set countdown timers (set_timer), and you can search the web for anything current. When the user asks you to remember, track, remind, or look something up, actually call the tool - don't just say you will. You run in a browser tab, so you can't open apps, touch files, or change settings on the user's actual computer; say so plainly if asked, instead of pretending otherwise. Keep the cat in you understated - dry, a little independent - never cutesy, and never at the expense of being genuinely useful.";

  var TOOLS = [
    { type: 'web_search_20250305', name: 'web_search' },
    { name: 'add_task', description: "Add a new task or reminder to Pelmenki's task list.", input_schema: { type: 'object', properties: { title: { type: 'string', description: 'The task text' } }, required: ['title'] } },
    { name: 'complete_task', description: 'Mark an existing open task as done, matched by its title text.', input_schema: { type: 'object', properties: { title: { type: 'string' } }, required: ['title'] } },
    { name: 'list_tasks', description: 'List all current tasks and whether each is done.', input_schema: { type: 'object', properties: {} } },
    { name: 'set_timer', description: 'Set a countdown timer that alerts the user by chat message (and voice, if enabled) when it finishes.', input_schema: { type: 'object', properties: { seconds: { type: 'number' }, label: { type: 'string' } }, required: ['seconds'] } }
  ];
  var CLIENT_TOOL_NAMES = ['add_task', 'complete_task', 'list_tasks', 'set_timer'];

  // ---- state ----
  var apiMessages = [];
  var tasks = [];
  var settings = { apiKey: '', voiceId: 'yl2ZDV1MzN4HbQJbMihG', voiceModel: 'eleven_flash_v2_5', voiceEnabled: true, remember: false };
  var status = 'idle';

  // ---- dom refs ----
  var chatLog = document.getElementById('chatLog');
  var chatInput = document.getElementById('chatInput');
  var sendBtn = document.getElementById('sendBtn');
  var micBtn = document.getElementById('micBtn');
  var taskList = document.getElementById('taskList');
  var taskInput = document.getElementById('taskInput');
  var taskAddBtn = document.getElementById('taskAddBtn');
  var statusLabel = document.getElementById('statusLabel');
  var eyeMark = document.getElementById('eyeMark');
  var settingsBtn = document.getElementById('settingsBtn');
  var modalBackdrop = document.getElementById('modalBackdrop');
  var modalCancel = document.getElementById('modalCancel');
  var modalSave = document.getElementById('modalSave');
  var apiKeyInput = document.getElementById('apiKeyInput');
  var voiceIdInput = document.getElementById('voiceIdInput');
  var voiceQualitySelect = document.getElementById('voiceQualitySelect');
  var voiceEnabledInput = document.getElementById('voiceEnabledInput');
  var rememberInput = document.getElementById('rememberInput');
  var ttsPlayer = document.getElementById('ttsPlayer');
  var tabChatBtn = document.getElementById('tabChatBtn');
  var tabTasksBtn = document.getElementById('tabTasksBtn');
  var chatPanel = document.getElementById('chatPanel');
  var tasksPanel = document.getElementById('tasksPanel');
  var inputBar = document.getElementById('inputBar');

  function setStatus(s){
    status = s;
    eyeMark.classList.remove('idle', 'listening', 'thinking', 'speaking');
    eyeMark.classList.add(s);
    statusLabel.textContent = s;
    micBtn.classList.toggle('active', s === 'listening');
  }

  function addMessage(role, text){
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function renderTasks(){
    taskList.innerHTML = '';
    if(tasks.length === 0){
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = 'Nothing on the list.';
      taskList.appendChild(empty);
      return;
    }
    tasks.forEach(function(t){
      var li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '');
      var check = document.createElement('button');
      check.className = 'task-check';
      check.setAttribute('aria-label', t.done ? 'Mark not done' : 'Mark done');
      check.textContent = t.done ? '✓' : '';
      check.addEventListener('click', function(){ t.done = !t.done; saveTasks(); renderTasks(); });
      var span = document.createElement('span');
      span.className = 'task-title';
      span.textContent = t.title;
      var del = document.createElement('button');
      del.className = 'task-del';
      del.setAttribute('aria-label', 'Delete task');
      del.textContent = '×';
      del.addEventListener('click', function(){ tasks = tasks.filter(function(x){ return x.id !== t.id; }); saveTasks(); renderTasks(); });
      li.appendChild(check);
      li.appendChild(span);
      li.appendChild(del);
      taskList.appendChild(li);
    });
  }

  // ---- storage ----
  function loadTasks(){
    return window.storage.get('tasks', false).then(function(r){
      tasks = r ? JSON.parse(r.value) : [];
    }).catch(function(){ tasks = []; }).then(renderTasks);
  }
  function saveTasks(){
    window.storage.set('tasks', JSON.stringify(tasks), false).catch(function(e){ console.error('save tasks failed', e); });
  }
  function loadSettings(){
    return window.storage.get('settings', false).then(function(r){
      if(r){ var s = JSON.parse(r.value); settings = Object.assign({}, settings, s); }
    }).catch(function(){ /* nothing saved yet */ }).then(function(){
      voiceIdInput.value = settings.voiceId;
      voiceQualitySelect.value = settings.voiceModel;
      voiceEnabledInput.checked = settings.voiceEnabled;
      rememberInput.checked = settings.remember;
      apiKeyInput.value = settings.remember ? settings.apiKey : '';
    });
  }
  function persistSettings(){
    if(settings.remember){
      window.storage.set('settings', JSON.stringify(settings), false).catch(function(e){ console.error(e); });
    } else {
      window.storage.delete('settings', false).catch(function(){ /* fine if nothing to delete */ });
    }
  }

  // ---- tools ----
  function runLocalTool(name, input){
    try {
      if(name === 'add_task'){
        var title = String(input.title || '').trim();
        if(!title) return 'No task title given.';
        tasks.push({ id: 't' + Date.now() + Math.random().toString(36).slice(2, 7), title: title, done: false });
        saveTasks(); renderTasks();
        return 'Added: "' + title + '"';
      }
      if(name === 'complete_task'){
        var q = String(input.title || '').toLowerCase();
        var match = tasks.find(function(t){ return !t.done && t.title.toLowerCase().indexOf(q) !== -1; }) ||
                    tasks.find(function(t){ return !t.done && q.indexOf(t.title.toLowerCase()) !== -1; });
        if(!match) return 'No open task matching "' + input.title + '".';
        match.done = true; saveTasks(); renderTasks();
        return 'Marked "' + match.title + '" done.';
      }
      if(name === 'list_tasks'){
        if(tasks.length === 0) return 'No tasks yet.';
        return tasks.map(function(t){ return (t.done ? '[done] ' : '[ ] ') + t.title; }).join('\n');
      }
      if(name === 'set_timer'){
        var secs = Math.max(1, Number(input.seconds) || 0);
        var label = input.label || 'Timer';
        setTimeout(function(){
          addMessage('assistant', "Timer's up - " + label + '.');
          speak("Timer's up. " + label + '.');
        }, secs * 1000);
        return 'Timer set for ' + secs + ' seconds.';
      }
      return 'Unknown tool: ' + name;
    } catch(e) {
      return 'Tool error: ' + e.message;
    }
  }

  // ---- claude brain ----
  function callPelmenki(){
    return (function loop(i){
      if(i >= 6) return Promise.resolve("That got tangled - let's try something simpler.");
      return fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          system: SYSTEM_PROMPT,
          messages: apiMessages,
          tools: TOOLS
        })
      }).then(function(res){
        if(!res.ok) throw new Error('API error ' + res.status);
        return res.json();
      }).then(function(data){
        apiMessages.push({ role: 'assistant', content: data.content });
        var clientCalls = data.content.filter(function(b){ return b.type === 'tool_use' && CLIENT_TOOL_NAMES.indexOf(b.name) !== -1; });
        if(clientCalls.length === 0){
          var text = data.content.filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('\n').trim();
          return text || '…';
        }
        var results = clientCalls.map(function(tu){ return { type: 'tool_result', tool_use_id: tu.id, content: runLocalTool(tu.name, tu.input) }; });
        apiMessages.push({ role: 'user', content: results });
        return loop(i + 1);
      });
    })(0);
  }

  // ---- voice out ----
  function speak(text){
    if(!settings.voiceEnabled || !text) return;
    if(settings.apiKey){ speakElevenLabs(text); } else { speakBrowser(text); }
  }
  function speakBrowser(text){
    if(!('speechSynthesis' in window)){ setStatus('idle'); return; }
    var u = new SpeechSynthesisUtterance(text);
    u.onstart = function(){ setStatus('speaking'); };
    u.onend = function(){ setStatus('idle'); };
    u.onerror = function(){ setStatus('idle'); };
    speechSynthesis.speak(u);
  }
  function speakElevenLabs(text){
    setStatus('speaking');
    fetch('https://api.elevenlabs.io/v1/text-to-speech/' + encodeURIComponent(settings.voiceId), {
      method: 'POST',
      headers: { 'xi-api-key': settings.apiKey, 'Content-Type': 'application/json', 'Accept': 'audio/mpeg' },
      body: JSON.stringify({ text: text, model_id: settings.voiceModel, voice_settings: { stability: 0.5, similarity_boost: 0.75 } })
    }).then(function(res){
      if(!res.ok) throw new Error('TTS ' + res.status);
      return res.blob();
    }).then(function(blob){
      var url = URL.createObjectURL(blob);
      ttsPlayer.src = url;
      ttsPlayer.onended = function(){ setStatus('idle'); URL.revokeObjectURL(url); };
      return ttsPlayer.play();
    }).catch(function(e){
      console.error('ElevenLabs TTS failed, falling back to browser voice:', e);
      speakBrowser(text);
    });
  }

  // ---- send flow ----
  function handleSend(text){
    var value = (text != null ? text : chatInput.value).trim();
    if(!value) return;
    chatInput.value = '';
    addMessage('user', value);
    apiMessages.push({ role: 'user', content: value });
    setStatus('thinking');
    callPelmenki().then(function(reply){
      addMessage('assistant', reply);
      if(settings.voiceEnabled){ speak(reply); } else { setStatus('idle'); }
    }).catch(function(e){
      console.error(e);
      addMessage('assistant', "Couldn't reach my brain just now - try again in a moment.");
      setStatus('idle');
    });
  }

  // ---- speech recognition ----
  var recognition = null;
  function initRecognition(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ micBtn.disabled = true; micBtn.title = 'Voice input not supported in this browser'; return; }
    recognition = new SR();
    recognition.lang = navigator.language || 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onstart = function(){ setStatus('listening'); };
    recognition.onerror = function(){ setStatus('idle'); };
    recognition.onend = function(){ if(status === 'listening') setStatus('idle'); };
    recognition.onresult = function(e){
      var transcript = e.results[0][0].transcript;
      handleSend(transcript);
    };
  }
  function toggleMic(){
    if(!recognition) return;
    if(status === 'listening'){ recognition.stop(); } else { recognition.start(); }
  }

  // ---- tabs ----
  function setTab(tab){
    var isChat = tab === 'chat';
    tabChatBtn.classList.toggle('active', isChat);
    tabTasksBtn.classList.toggle('active', !isChat);
    chatPanel.hidden = !isChat;
    tasksPanel.hidden = isChat;
    inputBar.hidden = !isChat;
  }

  // ---- settings modal ----
  function openSettings(){ modalBackdrop.hidden = false; }
  function closeSettings(){ modalBackdrop.hidden = true; }
  function saveSettings(){
    settings.apiKey = apiKeyInput.value.trim();
    settings.voiceId = voiceIdInput.value.trim() || 'yl2ZDV1MzN4HbQJbMihG';
    settings.voiceModel = voiceQualitySelect.value;
    settings.voiceEnabled = voiceEnabledInput.checked;
    settings.remember = rememberInput.checked;
    persistSettings();
    closeSettings();
  }

  // ---- events ----
  sendBtn.addEventListener('click', function(){ handleSend(); });
  chatInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') handleSend(); });
  micBtn.addEventListener('click', toggleMic);
  taskAddBtn.addEventListener('click', function(){
    var v = taskInput.value.trim();
    if(!v) return;
    tasks.push({ id: 't' + Date.now() + Math.random().toString(36).slice(2, 7), title: v, done: false });
    taskInput.value = '';
    saveTasks(); renderTasks();
  });
  taskInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') taskAddBtn.click(); });
  tabChatBtn.addEventListener('click', function(){ setTab('chat'); });
  tabTasksBtn.addEventListener('click', function(){ setTab('tasks'); });
  settingsBtn.addEventListener('click', openSettings);
  modalCancel.addEventListener('click', closeSettings);
  modalSave.addEventListener('click', saveSettings);
  modalBackdrop.addEventListener('click', function(e){ if(e.target === modalBackdrop) closeSettings(); });

  // ---- init ----
  Promise.all([loadSettings(), loadTasks()]).then(function(){
    initRecognition();
    setStatus('idle');
    addMessage('assistant', "Pelmenki's up. What do you need?");
  });
})();
</script>
</body>
</html>
